<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2oss Coin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --copper-1:#9aa1a6;
    --copper-2:#e4e8ea;
    --copper-3:#5c6266;
    --copper-hi:#ffffff;
    --bg-1:#1c1410;
    --bg-2:#100c09;
    --ink:#f1e6d8;
    --ink-dim:#b3a290;
    --accent:#cfd6da;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    background:
      radial-gradient(ellipse at 50% -10%, #2a1e16 0%, transparent 60%),
      radial-gradient(ellipse at 50% 120%, #0a0705 0%, transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2));
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
  }

  .titlebar{
    position:fixed;
    right:16px;
    bottom:12px;
    text-align:right;
    pointer-events:none;
    z-index:5;
  }
  .titlebar h1{
    margin:0;
    font-size:13px;
    letter-spacing:0.5px;
    font-weight:600;
    color:var(--ink-dim);
    opacity:0.65;
  }
  .titlebar h1 .zero{
    color:var(--accent);
    font-variant-numeric:normal;
  }

  /* Settings */
  .settings-btn{
    position:fixed;
    top:16px;
    left:16px;
    z-index:20;
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.06);
    color:var(--ink-dim);
    font-size:18px;
    cursor:pointer;
    transition:background 120ms ease, color 120ms ease;
  }
  .settings-btn:hover{
    background:rgba(255,255,255,0.12);
    color:var(--ink);
  }
  .settings-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:30;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .settings-overlay.open{
    display:flex;
  }
  .settings-panel{
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg,#1f1712,#140f0b);
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    padding:22px 22px 30px;
    box-shadow:0 -8px 30px rgba(0,0,0,0.5);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .settings-panel h2{
    margin:0 0 14px;
    font-size:16px;
    letter-spacing:0.3px;
    color:var(--ink);
  }
  .settings-section-label{
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-dim);
    opacity:0.7;
    margin:0 0 8px;
  }
  .coin-option{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:12px 10px;
    border-radius:12px;
    border:none;
    background:transparent;
    color:var(--ink);
    font-size:15px;
    text-align:left;
    cursor:pointer;
    transition:background 120ms ease;
  }
  .coin-option:hover{
    background:rgba(255,255,255,0.05);
  }
  .coin-option .radio{
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid var(--ink-dim);
    flex-shrink:0;
    position:relative;
  }
  .coin-option.selected .radio{
    border-color:var(--accent);
  }
  .coin-option.selected .radio::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--accent);
  }
  .coin-option.selected{
    color:var(--accent);
  }
  .settings-close{
    display:block;
    margin:18px auto 0;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-size:13px;
    padding:8px 16px;
    cursor:pointer;
  }

  .stage{
    flex:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:10px 20px 36px;
    perspective:1400px;
  }

  .coin-wrap{
    position:relative;
    width:220px;
    height:220px;
    margin-bottom:38px;
    transform:translateY(0);
    filter:drop-shadow(0 18px 22px rgba(0,0,0,0.55));
  }
  .coin-wrap.lifted{
    transform:translateY(-1.4in);
  }

  .coin{
    position:absolute;
    inset:0;
    border-radius:50%;
    transform-style:preserve-3d;
  }

  .face{
    position:absolute;
    inset:0;
    border-radius:50%;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 32% 28%, var(--copper-hi) 0%, var(--copper-2) 22%, var(--copper-1) 55%, var(--copper-3) 88%, #2b2f31 100%);
    box-shadow:
      inset 0 0 0 6px rgba(0,0,0,0.18),
      inset 0 2px 10px rgba(255,255,255,0.45),
      inset 0 -10px 18px rgba(0,0,0,0.45);
  }
  .face::before{
    /* milled rim */
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg,
        rgba(255,255,255,0.4) 0deg 1.2deg,
        rgba(40,44,46,0.4) 1.2deg 2.4deg);
    -webkit-mask:radial-gradient(circle, transparent 92%, black 93%, black 100%);
            mask:radial-gradient(circle, transparent 92%, black 93%, black 100%);
  }
  .face .inner-ring{
    position:absolute;
    inset:14px;
    border-radius:50%;
    border:2px solid rgba(90,95,100,0.55);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.3),
      inset 0 0 8px rgba(0,0,0,0.3);
  }
  .face .art{
    position:relative;
    width:76%;
    height:76%;
  }
  .face .art svg{
    width:100%;
    height:100%;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,0.4)) drop-shadow(0 -1px 1px rgba(40,44,46,0.65));
  }
  .face .label{
    position:absolute;
    bottom:22%;
    left:0; right:0;
    text-align:center;
    font-family:'Trajan Pro','Cinzel',Georgia,serif;
    font-size:13px;
    letter-spacing:3px;
    color:#33383b;
    opacity:0.75;
  }
  .face.photo-face{
    background-image:var(--photo-url);
    background-size:cover;
    background-position:center;
    box-shadow:
      inset 0 0 0 3px rgba(0,0,0,0.15),
      inset 0 2px 8px rgba(255,255,255,0.25),
      inset 0 -8px 14px rgba(0,0,0,0.35);
  }
  .face.photo-face::before{ display:none; }
  .face.photo-face .art,
  .face.photo-face .inner-ring,
  .face.photo-face .label{ display:none; }

  .heads{ transform:rotateY(0deg); }
  .tails{ transform:rotateY(180deg); }

  @keyframes wobble{
    0%{ }
    50%{ }
    100%{ }
  }

  .result{
    min-height:34px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:16px;
    letter-spacing:0.5px;
    color:var(--ink-dim);
    margin-bottom:26px;
    text-align:center;
  }
  .result.show{
    color:var(--accent);
    font-weight:600;
    font-size:19px;
  }

  .flip-btn{
    appearance:none;
    border:none;
    outline:none;
    padding:24px 76px;
    border-radius:999px;
    font-family:'Cinzel','Trajan Pro',Georgia,serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:3px;
    color:#202325;
    background:linear-gradient(180deg,var(--copper-hi),var(--copper-2) 55%,var(--copper-1));
    box-shadow:
      0 10px 18px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -3px 6px rgba(70,75,78,0.4);
    transition:transform 120ms ease, box-shadow 120ms ease;
    margin-bottom:18px;
  }
  .flip-btn:active{
    transform:translateY(2px) scale(0.98);
    box-shadow:
      0 4px 10px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -2px 4px rgba(70,75,78,0.4);
  }
  .flip-btn:disabled{
    opacity:0.55;
  }

  @media (prefers-reduced-motion: reduce){
    .coin-wrap{ transition:none !important; }
  }

  /* Link back to the games home page */
  .home-link{
    position:fixed;
    top:16px;
    right:16px;
    z-index:20;
    padding:9px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    color:var(--ink-dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    transition:background 120ms ease, color 120ms ease;
  }
  .home-link:hover{ background:rgba(255,255,255,0.12); color:var(--ink); }
  .home-link:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>

  <a class="home-link" href="index.html">Home</a>

  <button class="settings-btn" id="settingsBtn" aria-label="Settings">⚙</button>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">

      <p class="settings-section-label">Change Coin</p>

      <button class="coin-option" id="optDollar" data-coin="dollar">

      <button class="settings-close" id="settingsClose">Close</button>
    </div>
  </div>

  const coinSets = {
    quarter: { heads: quarterHeadsUrl, tails: quarterTailsUrl },
    dollar:  { heads: dollarHeadsUrl,  tails: dollarUrl }
  };

  function selectCoin(key){
    headsFace.style.setProperty('--photo-url', coinSets[key].heads);
    tailsFace.style.setProperty('--photo-url', coinSets[key].tails);
    optQuarter.classList.toggle('selected', key === 'quarter');
    optDollar.classList.toggle('selected', key === 'dollar');
  }

  function openSettings(){ settingsOverlay.classList.add('open'); }
  function closeSettings(){ settingsOverlay.classList.remove('open'); }

  settingsBtn.addEventListener('click', openSettings);
  settingsClose.addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', function(e){
    if (e.target === settingsOverlay) closeSettings();
  });
  optQuarter.addEventListener('click', function(){ selectCoin('quarter'); closeSettings(); });
  optDollar.addEventListener('click', function(){ selectCoin('dollar'); closeSettings(); });

  let currentRotation = 0; // degrees around Y
  let flipping = false;
  let audioCtx = null;

  function getAudioCtx(){
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    return audioCtx;
  }

  function playTossSound(){
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    // 1) the sharp "flick" transient — the thumbnail striking the coin
    const clickDur = 0.05;
    const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * clickDur), ctx.sampleRate);
    const clickData = clickBuf.getChannelData(0);
    for (let i = 0; i < clickData.length; i++){
      clickData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / clickData.length, 3);
    }
    const click = ctx.createBufferSource();
    click.buffer = clickBuf;
    const clickFilter = ctx.createBiquadFilter();
    clickFilter.type = 'highpass';
    clickFilter.frequency.value = 3200;
    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(0.5, now);
    clickGain.gain.exponentialRampToValueAtTime(0.001, now + clickDur);
    click.connect(clickFilter);
    clickFilter.connect(clickGain);
    clickGain.connect(ctx.destination);
    click.start(now);

    // 2) metallic ring — inharmonic partials, like a struck coin's own
    //    resonance, each decaying at a slightly different rate
    const base = 1250;
    const partials = [
      { mult: 1.0,  gain: 0.22, decay: 0.55 },
      { mult: 2.37, gain: 0.14, decay: 0.42 },
      { mult: 3.81, gain: 0.09, decay: 0.30 },
      { mult: 5.62, gain: 0.05, decay: 0.20 },
      { mult: 0.62, gain: 0.10, decay: 0.65 }
    ];
    partials.forEach(function(p){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      const f = base * p.mult;
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(f * 0.985, now + p.decay);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(p.gain, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + p.decay + 0.05);
    });

    // 3) a short breath of filtered noise for the "whoosh" as it leaves the hand
    const bufferSize = Math.floor(ctx.sampleRate * 0.25);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 2200;
    noiseFilter.Q.value = 0.7;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.06, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(now);
  }

  const FAST_MS = 8000;   // fast constant spin
  const SLOW_MS = 4000;   // decelerate to a stop
  const TOTAL_MS = FAST_MS + SLOW_MS; // 12s total
  const LOWER_MS = 5000;  // coin eases back down over the last 5s

  function vibrate(pattern){
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch(e) {}
    }
  }

  function flipCoin(){
    if (flipping) return;
    flipping = true;
    btn.disabled = true;
    resultEl.classList.remove('show');
    resultEl.textContent = 'Tossing…';

    playTossSound();

    // decide outcome using the known 50/50 probability of a fair coin
    const isHeads = Math.random() < 0.5;
    const targetFace = isHeads ? 0 : 180;
    const base = currentRotation - (currentRotation % 360);

    // constant-speed spin: same fast rate for the entire 12 seconds, no
    // slow-down — full rotations spread evenly across FAST_MS + SLOW_MS
    const ratePerMs = 360 * 30 / FAST_MS; // degrees per ms, same as before
    const totalSpins = Math.round(ratePerMs * TOTAL_MS / 360);
    const finalRotation = base + totalSpins * 360 + (targetFace - (base % 360 + 360) % 360 + 360) % 360;
    currentRotation = finalRotation;

    // lift the coin up quickly as the toss begins
    coinWrap.style.transition = 'transform 480ms cubic-bezier(.2,.8,.25,1)';
    coinWrap.classList.add('lifted');

    coin.style.transition = 'transform ' + TOTAL_MS + 'ms linear';
    coin.style.transform = 'rotateY(' + finalRotation + 'deg)';

    // vibrate briskly, at the same steady rate, through the whole spin
    const buzzUnit = [35, 90];
    let buzzPattern = [];
    while (buzzPattern.reduce((a,b)=>a+b,0) < TOTAL_MS - 200) {
      buzzPattern = buzzPattern.concat(buzzUnit);
    }
    vibrate(buzzPattern);

    // ease the coin back down slowly over the last 5 seconds of the toss
    setTimeout(function(){
      coinWrap.style.transition = 'transform ' + LOWER_MS + 'ms ease-in-out';
      coinWrap.classList.remove('lifted');
    }, TOTAL_MS - LOWER_MS);

    setTimeout(function(){
      resultEl.textContent = isHeads ? 'Heads!' : 'Tails!';
      resultEl.classList.add('show');
      vibrate(isHeads ? [15] : [15, 40, 15]);

      flipping = false;
      btn.disabled = false;
    }, TOTAL_MS);
  }

  btn.addEventListener('click', flipCoin);

  // Alternate ways to toss: double-click anywhere, or swipe up on a phone
  document.addEventListener('dblclick', function(e){
    e.preventDefault();
    flipCoin();
  });

  let touchStartY = null;
  stage.addEventListener('touchstart', function(e){
    touchStartY = e.changedTouches[0].clientY;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchStartY === null) return;
    const dy = touchStartY - e.changedTouches[0].clientY;
    touchStartY = null;
    if (dy > 60) { // swiped up
      flipCoin();
    }
  }, {passive:true});
})();

<title>Sudoku 4×4 to 9×9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* Concept: you are inside the great fish. Ribs arch over a tunnel, daylight glows at the far end,
   the games are bone-white keys, and Jonah sits by a lantern at the bottom. One dark world, by design. */
:root{
  --abyss:#10404a; --deep:#1a5560; --glow:#3fa39b; --amber:#f4b650;
  --text:#f2ead8; --muted:#a8c4bd;
  --key:#e9dfc7; --key-edge:#9b8b64; --on-key:#12302f; --key-glow:rgba(0,0,0,.55);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%;
  background:var(--abyss); color:var(--text); font-family:var(--font);
  display:flex; justify-content:center;
  padding-block:36px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}

/* the scene behind everything */
.scene{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.scene svg.ribs{position:absolute; inset:0; width:100%; height:100%}
.scene::after{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 42%, transparent 35%, rgba(8,44,52,.4) 100%)}
.glow{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
.bubble{position:absolute; bottom:-20px; left:var(--x); width:var(--s); height:var(--s); border-radius:50%;
  border:1.5px solid rgba(190,240,230,.5); background:rgba(190,240,230,.08); opacity:0;
  animation:rise var(--d) linear var(--delay) infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0); opacity:0}12%{opacity:.6}100%{transform:translateY(-110vh) translateX(18px); opacity:0}}

main{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:36px; width:100%; max-width:560px; text-align:center}
h1{margin:0; font-family:var(--serif); font-weight:700; font-size:clamp(2.8rem,13vw,4rem); letter-spacing:-.02em; line-height:1; text-shadow:0 2px 24px rgba(63,163,155,.45)}
.sub{margin:12px auto 0; max-width:30ch; color:var(--muted); font-size:1.05rem; line-height:1.45; text-wrap:balance}
.keys{display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(14px,4vw,28px) clamp(18px,6vw,32px)}

/* The push-down square keys, cut from bone */
.key{
  --size:min(40vw, 230px);
  --d:clamp(8px, calc(var(--size) * .05), 14px);
  width:var(--size); height:var(--size);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  background:var(--key); color:var(--on-key);
  border-radius:clamp(18px, 9%, 32px);
  text-decoration:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  box-shadow:0 var(--d) 0 var(--key-edge), 0 calc(var(--d) * 1.9) 28px -8px var(--key-glow);
  transition:transform .09s ease-out, box-shadow .09s ease-out;
  margin-bottom:var(--d);
}
.key:hover{transform:translateY(-2px); box-shadow:0 calc(var(--d) + 2px) 0 var(--key-edge), 0 calc(var(--d) * 2.2) 32px -8px var(--key-glow)}
.key:active{transform:translateY(calc(var(--d) - 2px)); box-shadow:0 2px 0 var(--key-edge), 0 6px 10px -4px var(--key-glow)}
.key:focus-visible{outline:4px solid var(--amber); outline-offset:8px}
.key svg{width:62%; height:auto; display:block}
.key .go{font-size:clamp(1.1rem,4.8vw,1.8rem); font-weight:800; letter-spacing:-.01em; line-height:1}

.foot{display:flex; flex-direction:column; align-items:center; gap:6px}
.jonah{width:min(190px,52vw); height:auto; display:block; overflow:visible}
.verse{margin:0; max-width:34ch; font-family:var(--serif); font-style:italic; font-size:1rem; line-height:1.5; color:var(--muted); text-wrap:balance}
.verse cite{display:block; margin-top:4px; font-style:normal; font-size:.85rem; color:var(--amber)}
@media (prefers-reduced-motion:reduce){.key{transition:none} .glow,.bubble{animation:none} .bubble{display:none}}
</style>

<div class="scene" aria-hidden="true">
  <svg class="ribs" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b8089"/><stop offset=".55" stop-color="#1f6a72"/><stop offset="1" stop-color="#14464e"/></linearGradient>
      <radialGradient id="mouth" cx="200" cy="330" r="230" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8fe3d4" stop-opacity=".75"/><stop offset=".35" stop-color="#3fa39b" stop-opacity=".35"/><stop offset="1" stop-color="#3fa39b" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="400" height="800" fill="url(#wall)"/>
    <rect class="glow" width="400" height="800" fill="url(#mouth)"/>
    
  </svg>
  <span class="bubble" style="--x:9%;--s:9px;--d:13s;--delay:-3s"></span>
  <span class="bubble" style="--x:24%;--s:6px;--d:10s;--delay:-8s"></span>
  <span class="bubble" style="--x:41%;--s:11px;--d:15s;--delay:-1s"></span>
  <span class="bubble" style="--x:63%;--s:7px;--d:11s;--delay:-6s"></span>
  <span class="bubble" style="--x:78%;--s:10px;--d:14s;--delay:-10s"></span>
  <span class="bubble" style="--x:91%;--s:6px;--d:12s;--delay:-4s"></span>
</div>

<main>
  <div>
    <h1>Games</h1>
    <p class="sub">Four little games: Sudoku, a maze, tic-tac-toe and a crossword.</p>
  </div>

  <div class="keys">
    <a class="key" href="sudoku.html" aria-label="Play Sudoku">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
        <g stroke-width="1.5" opacity=".55">
          <path d="M25 0V100M75 0V100M0 25H100M0 75H100"/>
        </g>
        <g stroke-width="4" stroke-linecap="round">
          <path d="M50 0V100M0 50H100"/>
        </g>
        <g fill="currentColor" stroke="none" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">
          <text x="12.5" y="19.5">1</text><text x="62.5" y="19.5">3</text>
          <text x="37.5" y="44.5">4</text><text x="87.5" y="44.5">2</text>
          <text x="12.5" y="69.5">2</text><text x="62.5" y="69.5">4</text>
          <text x="37.5" y="94.5">3</text><text x="87.5" y="94.5">1</text>
        </g>
      </svg>
      <span class="go">Sudoku</span>
    </a>

    <a class="key" href="crossword.html" aria-label="Solve a crossword">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
        <g stroke-width="1.5" opacity=".6">
          <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100"/>
        </g>
        <!-- blocked squares -->
        <g fill="currentColor" stroke="none">
          <rect x="0" y="20" width="20" height="20"/><rect x="40" y="20" width="20" height="20"/><rect x="80" y="20" width="20" height="20"/>
          <rect x="20" y="60" width="20" height="20"/><rect x="60" y="60" width="20" height="20"/>        </g>
        <g fill="currentColor" stroke="none" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="15" text-anchor="middle">
          <text x="10" y="16">C</text><text x="30" y="16">R</text><text x="50" y="16">O</text><text x="70" y="16">S</text><text x="90" y="16">S</text>
          <text x="30" y="36">H</text><text x="70" y="36">A</text>
          <text x="10" y="56">W</text><text x="30" y="56">O</text><text x="50" y="56">R</text><text x="70" y="56">D</text><text x="90" y="56">S</text>
        </g>
        <rect x="1" y="1" width="98" height="98" rx="2" stroke-width="3"/>
      </svg>
      <span class="go">Crossword</span>
    </a>

    <a class="key" href="tictactoe.html" aria-label="Play tic-tac-toe">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
        <g stroke-width="4" stroke-linecap="round"><path d="M35 6V94M65 6V94M6 35H94M6 65H94"/></g>
        <!-- X in the top-left, O in the center, X in the bottom-right -->
        <g stroke-width="5" stroke-linecap="round"><path d="M12 12L28 28M28 12L12 28"/><path d="M72 72L88 88M88 72L72 88"/></g>
        <circle cx="50" cy="50" r="9" stroke-width="5"/>      </svg>
      <span class="go">Tic-tac-toe</span>
    </a>

    <a class="key" href="maze.html" aria-label="Run a maze">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
        <rect x="4" y="4" width="92" height="92" rx="3" stroke-width="5"/>
        <g stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 32H58"/><path d="M42 32V56"/><path d="M42 56H78"/><path d="M78 32V56"/><path d="M96 32H78"/><path d="M4 76H62"/><path d="M62 76V96"/><path d="M24 56V76"/>
        </g>
        <circle cx="18" cy="18" r="7" fill="currentColor" stroke="none"/>
        <text x="83" y="87" fill="currentColor" stroke="none" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">★</text>
      </svg>
      <span class="go">Maze</span>
    </a>
  </div>

  <div class="foot">
    <svg class="jonah" viewBox="0 0 160 100" role="img" aria-label="Jonah sitting beside a lantern inside the great fish">
      <defs><radialGradient id="lamp" cx="112" cy="62" r="52" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4b650" stop-opacity=".85"/><stop offset=".45" stop-color="#f4b650" stop-opacity=".22"/><stop offset="1" stop-color="#f4b650" stop-opacity="0"/></radialGradient></defs>
      <circle cx="112" cy="62" r="52" fill="url(#lamp)"/>
      <path d="M8 90Q80 82 152 90" fill="none" stroke="#e9dfc7" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
      <g fill="#04171b" stroke="#e9dfc7" stroke-opacity=".45" stroke-width="1.2" stroke-linejoin="round">
        <circle cx="60" cy="42" r="9"/>
        <path d="M40 90Q38 64 53 55Q68 51 78 61L97 70 95 77 81 76 83 90Z"/>
      </g>
      <path d="M107 56a5 5 0 0 1 10 0" fill="none" stroke="#04171b" stroke-width="2"/>
      <rect x="104" y="58" width="16" height="20" rx="3" fill="#f6c565" stroke="#04171b" stroke-width="2.4"/>
      <rect x="102" y="76" width="20" height="4" rx="1.5" fill="#04171b"/>
    </svg>
    <p class="verse">“Now the LORD had prepared a great fish to swallow up Jonah. And Jonah was in the belly of the fish three days and three nights.”<cite>Jonah 1:17</cite></p>
  </div>
</main>
